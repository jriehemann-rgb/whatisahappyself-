<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  /* Layout: ein Bildschirm, ein Kreis. Oben drei Balken für die Runden, unten zwei Knöpfe, ganz unten der Name. Farben wie die EQ-Grafik: Sand, Terrakotta, Schieferblau. */
  --bg:#f1e0c6;
  --ink:#1a1511;
  --slate:#4a6384;
  --muted:#6b5d4d;
  --line:#dcc6a3;
  --edge:#cdb48d;
  --accent:#b85727;
  --accent-ink:#fff8ee;
  --accent-soft:rgba(184,87,39,.13);
  --f:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html{height:100%}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{
  margin:0;min-height:100%;display:flex;flex-direction:column;
  background-color:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px 16px;
  -webkit-tap-highlight-color:transparent;
}
.app{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column}

.top{display:flex;align-items:flex-start;gap:14px;min-height:44px}
.rounds{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rounds.solo{grid-template-columns:1fr}
.round{min-width:0}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.lab{margin-top:8px;display:flex;flex-direction:column;font-size:12px;line-height:1.35;color:var(--muted)}
.lab b{font-weight:600}
.round.is-now .lab b{color:var(--accent)}
.round.is-done .lab b{color:var(--ink)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:transparent;color:var(--slate);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .off{display:none}
.icon-btn[aria-pressed="false"] .waves{display:none}
.icon-btn[aria-pressed="false"] .off{display:inline}
.icon-btn[aria-pressed="false"]{color:var(--muted)}

.stage{flex:1 1 0;min-height:240px;display:grid;place-items:center}
.orb{position:relative}
.orb canvas{display:block}
.core{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.word{font-weight:400;font-size:max(32px,calc(var(--u,1)*46px));line-height:1;letter-spacing:-.02em;color:var(--accent-ink);font-variant-numeric:tabular-nums}

.copy{text-align:center;padding-block:4px 8px}
.copy h1{margin:0;min-height:1.3em;font-weight:500;font-size:22px;line-height:1.3;letter-spacing:.01em;color:var(--slate)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:380px;margin:6px auto 0}
.seg button{padding:10px 6px;border:1px solid var(--edge);border-radius:999px;background:transparent;color:var(--slate);font:500 14px/1.2 var(--f);cursor:pointer}
.seg button[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px;margin:14px auto 0}
.btn{min-height:52px;padding:0 20px;border-radius:999px;border:1px solid var(--slate);background:transparent;color:var(--ink);font:500 16px/1 var(--f);cursor:pointer;transition:transform .12s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary.quiet{background:transparent;border-color:var(--slate);color:var(--ink);font-weight:500}
.btn.wide{grid-column:1/-1}
.btn:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}

.brand{margin-top:18px;padding-top:12px;border-top:1px solid var(--accent);text-align:center;font:700 12px/1 var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="rounds" id="rounds">
      <div class="round" aria-label="Runde 1"><div class="bar"><i></i></div><div class="lab"><b>30 Sekunden</b><span>+ 15 Sekunden</span></div></div>
      <div class="round" aria-label="Runde 2"><div class="bar"><i></i></div><div class="lab"><b>1 Minute</b><span>+ 15 Sekunden</span></div></div>
      <div class="round" aria-label="Runde 3"><div class="bar"><i></i></div><div class="lab"><b>1:30 Minuten</b><span>+ 15 Sekunden</span></div></div>
    </div>
    <div class="rounds solo" id="solo" hidden><div class="round is-now"><div class="bar"><i></i></div><div class="lab"><b id="solo-t"></b><span id="solo-s"></span></div></div></div>
    <button id="btn-sound" class="icon-btn" type="button" aria-pressed="true" aria-label="Ton ausschalten">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><g class="waves"><path d="M16.5 9.2a4 4 0 0 1 0 5.6"/><path d="M19 6.7a7.5 7.5 0 0 1 0 10.6"/></g><g class="off"><path d="M16.5 9.5l4.5 5M21 9.5l-4.5 5"/></g></svg>
    </button>
  </header>

  <main class="stage" id="stage">
    <div class="orb" id="orb">
      <canvas id="cv" aria-hidden="true"></canvas>
      <div class="core"><div class="word" id="word"></div></div>
    </div>
  </main>

  <section class="copy">
    <h1 id="ttl" aria-live="polite"></h1>
  </section>

  <div class="seg" id="modes" role="radiogroup" aria-label="Übung"></div>
  <div class="seg" id="seg" role="radiogroup" aria-label="Atemtempo"></div>

  <div class="controls">
    <button id="btn-main" class="btn primary wide" type="button">Atmung starten</button>
    <button id="btn-side" class="btn" type="button" hidden>Abbrechen</button>
  </div>

  <footer class="brand">What is a Happy Self</footer>
</div>

<script>
(function(){
'use strict';
var HOLDS=[30,60,90];            // Haltezeit nach der Ausatmung je Runde, in Sekunden
var BREATHS=30, PREP=3, REC_IN=3.2, REC_HOLD=15, REC_OUT=3.2, INHALE=0.52;
var TEMPOS={calm:{name:'Ruhig',cycle:4.0},normal:{name:'Normal',cycle:3.2},fast:{name:'Zügig',cycle:2.6}};
var PROGS={
  wh:{name:'Wim Hof'},
  slow:{name:'4-6 Atmen',t:'4 Sekunden ein, 6 aus',s:'3 Minuten',cyc:10000,n:18,seg:[4000,6000]},
  sigh:{name:'Seufzen',t:'Zweimal ein, lang aus',s:'3 Minuten',cyc:9000,n:20,seg:[2000,1000,6000]}
};
var TAU=Math.PI*2;

function $(id){return document.getElementById(id)}
function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}
function ease(x){x=Math.min(1,Math.max(0,x));return (1-Math.cos(Math.PI*x))/2}
var reduce=false;try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}

var el={stage:$('stage'),orb:$('orb'),cv:$('cv'),word:$('word'),ttl:$('ttl'),
  main:$('btn-main'),side:$('btn-side'),sound:$('btn-sound'),seg:$('seg'),modes:$('modes'),rounds:$('rounds'),solo:$('solo'),soloT:$('solo-t'),soloS:$('solo-s')};
var roundEls=[].slice.call(document.querySelectorAll('.round'));
var ctx=el.cv.getContext('2d');

var st={prg:load('wh-prg','wh'),mode:'idle',tempo:load('wh-tempo','normal'),sound:load('wh-sound','on')!=='off',
  phases:[],idx:0,e:0,bk:-1,pc:-1,hm:0,early:null,prog:0,sideAct:'stop'};
if(!TEMPOS[st.tempo])st.tempo='normal';
if(!PROGS[st.prg])st.prg='wh';
var roundTotals=[];

/* ---------- Ablauf ---------- */
function build(){
  var cyc=TEMPOS[st.tempo].cycle*1000,a=[],r,i,off,ph,list;
  roundTotals=[];
  if(st.prg!=='wh'){
    var P=PROGS[st.prg];
    list=[{t:'prep',dur:PREP*1000},{t:'cyc',dur:P.n*P.cyc,cyc:P.cyc}];
    off=0;
    for(i=0;i<list.length;i++){ph=list[i];ph.r=0;ph.off=off;off+=ph.dur;a.push(ph)}
    roundTotals.push(off);st.phases=a;return;
  }
  for(r=0;r<HOLDS.length;r++){
    list=[{t:'prep',dur:PREP*1000},{t:'breath',dur:BREATHS*cyc,cyc:cyc},{t:'hold',dur:HOLDS[r]*1000},
      {t:'recIn',dur:REC_IN*1000},{t:'recHold',dur:REC_HOLD*1000},{t:'recOut',dur:REC_OUT*1000}];
    off=0;
    for(i=0;i<list.length;i++){ph=list[i];ph.r=r;ph.off=off;off+=ph.dur;a.push(ph)}
    roundTotals.push(off);
  }
  st.phases=a;
}

/* ---------- Ton ---------- */
var ac=null,master=null;
function initAudio(){
  if(ac)return;
  try{var C=window.AudioContext||window.webkitAudioContext;ac=new C();master=ac.createGain();master.gain.value=0.9;master.connect(ac.destination)}catch(e){ac=null}
}
function tone(f,dur,o){
  if(!ac||!st.sound)return;
  o=o||{};
  try{
    var t=ac.currentTime+(o.delay||0),osc=ac.createOscillator(),g=ac.createGain(),v=o.gain||0.08;
    osc.type='sine';osc.frequency.setValueAtTime(f,t);
    if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    g.gain.setValueAtTime(0,t);
    if(o.bell){g.gain.linearRampToValueAtTime(v,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur)}
    else{g.gain.linearRampToValueAtTime(v,t+dur*0.4);g.gain.linearRampToValueAtTime(0,t+dur)}
    osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+dur+0.05);
  }catch(e){}
}
function bell(f,len){tone(f,len||1.8,{bell:true,gain:0.1});tone(f*2,(len||1.8)*0.6,{bell:true,gain:0.025})}
function tick(){tone(660,0.14,{bell:true,gain:0.06})}
function chime(){bell(523,1.6);tone(659,1.6,{bell:true,gain:0.09,delay:0.22});tone(784,1.8,{bell:true,gain:0.09,delay:0.44})}
function finishTune(){[392,494,587,784].forEach(function(f,i){tone(f,2.2,{bell:true,gain:0.09,delay:i*0.3})})}

/* ---------- Phasen ---------- */
function phaseStart(ph){
  st.bk=-1;st.pc=-1;st.hm=0;
  if(ph.t==='hold')bell(330);
  else if(ph.t==='recIn')tone(190,ph.dur/1000,{to:330,gain:0.08});
  else if(ph.t==='recHold')bell(392);
  else if(ph.t==='recOut')tone(330,ph.dur/1000,{to:190,gain:0.07});
}
function phaseEnd(ph,natural){
  if(ph.t==='cyc'&&natural)chime();
  if(ph.t==='hold'){st.early=null;if(natural)chime()}
  else if(ph.t==='recHold')bell(523,1.4);
}
function advance(){
  var ph=st.phases[st.idx],left;
  while(ph&&st.e>=ph.dur){
    left=st.e-ph.dur;
    phaseEnd(ph,st.early===null);
    st.idx++;
    if(st.idx>=st.phases.length){finish();return}
    st.e=left;ph=st.phases[st.idx];phaseStart(ph);
  }
}
function finish(){st.mode='done';st.idx=0;st.e=0;unwake();finishTune()}

/* ---------- Steuerung ---------- */
var wl=null;
function wake(){try{if('wakeLock' in navigator){navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})}}catch(e){}}
function unwake(){try{if(wl){wl.release();wl=null}}catch(e){}}
function start(){
  initAudio();
  if(ac&&ac.state==='suspended')ac.resume();
  build();st.mode='run';st.idx=0;st.e=0;st.early=null;st.prog=0;
  phaseStart(st.phases[0]);wake();
}
function pause(){st.mode='pause';try{if(ac&&ac.state==='running')ac.suspend()}catch(e){}}
function resume(){st.mode='run';try{if(ac)ac.resume()}catch(e){}wake()}
function stop(){st.mode='idle';st.idx=0;st.e=0;st.early=null;unwake();try{if(ac)ac.resume()}catch(e){}}
function skipHold(){var ph=st.phases[st.idx];if(st.mode==='run'&&ph&&ph.t==='hold'){st.early=st.e;st.e=ph.dur}}

el.main.addEventListener('click',function(){
  if(st.mode==='idle'||st.mode==='done')start();
  else if(st.mode==='run')pause();
  else if(st.mode==='pause')resume();
});
el.side.addEventListener('click',function(){if(st.sideAct==='skip')skipHold();else stop()});
document.addEventListener('keydown',function(ev){
  if(ev.code==='Space'&&!(ev.target&&ev.target.tagName==='BUTTON')){ev.preventDefault();el.main.click()}
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&st.mode==='run')pause();
  else if(!document.hidden&&st.mode==='run')wake();
});

function syncSound(){
  el.sound.setAttribute('aria-pressed',st.sound?'true':'false');
  el.sound.setAttribute('aria-label',st.sound?'Ton ausschalten':'Ton einschalten');
}
el.sound.addEventListener('click',function(){
  st.sound=!st.sound;save('wh-sound',st.sound?'on':'off');
  if(st.sound){initAudio();if(st.mode!=='pause'){try{if(ac)ac.resume()}catch(e){}}}
  syncSound();
});

Object.keys(TEMPOS).forEach(function(key){
  var b=document.createElement('button');
  b.type='button';b.id='tempo-'+key;b.setAttribute('role','radio');
  b.textContent=TEMPOS[key].name;
  b.addEventListener('click',function(){
    if(st.mode==='run'||st.mode==='pause')return;
    st.tempo=key;save('wh-tempo',key);syncSeg();
  });
  el.seg.appendChild(b);
});
Object.keys(PROGS).forEach(function(key){
  var b=document.createElement('button');
  b.type='button';b.id='prg-'+key;b.setAttribute('role','radio');
  b.textContent=PROGS[key].name;
  b.addEventListener('click',function(){
    if(st.mode==='run'||st.mode==='pause')return;
    st.prg=key;save('wh-prg',key);st.mode='idle';syncModes();
  });
  el.modes.appendChild(b);
});
function syncModes(){
  [].forEach.call(el.modes.children,function(b){b.setAttribute('aria-checked',b.id==='prg-'+st.prg?'true':'false')});
}
function syncSeg(){
  [].forEach.call(el.seg.children,function(b){b.setAttribute('aria-checked',b.id==='tempo-'+st.tempo?'true':'false')});
}

/* ---------- Zustand je Frame ---------- */
var rs={p:0.4,g:0.5,dotA:1,arcA:0};
var vs={filled:0,curF:-1,word:'',title:''};

function step(dt,now){
  var ph=st.phases[st.idx],m=st.mode,pT,gT,dT=1,aT=0,e,d,k;
  vs.filled=0;vs.curF=-1;
  if(m==='idle'||m==='done'||!ph){
    pT=reduce?0.4:0.4+0.14*Math.sin(now/1000*TAU/7);gT=0.5;
    if(m==='done'){vs.filled=st.prg==='wh'?BREATHS:0;vs.word='Fertig';vs.title='Geschafft'}
    else{vs.word='';vs.title=''}
  }else{
    e=st.e;d=ph.dur;
    if(ph.t==='cyc'){
      var P=PROGS[st.prg],cn=Math.min(P.n-1,Math.floor(e/P.cyc)),t=e-cn*P.cyc,sg=0,acc=0,sk;
      while(sg<P.seg.length-1&&t>=acc+P.seg[sg]){acc+=P.seg[sg];sg++}
      sk=(t-acc)/P.seg[sg];
      if(st.prg==='slow'){pT=sg===0?ease(sk):1-ease(sk);vs.word=sg===0?'Ein':'Aus'}
      else if(sg===0){pT=0.78*ease(sk);vs.word='Ein'}
      else if(sg===1){pT=0.78+0.22*ease(sk);vs.word='Mehr'}
      else{pT=1-ease(sk);vs.word='Aus'}
      gT=0.3+0.7*pT;dT=0;aT=1;st.prog=e/d;vs.title='Atmen · '+fmt((d-e)/1000);
      var ck=cn*4+sg;
      if(m==='run'&&ck!==st.bk){
        st.bk=ck;var sc=P.seg[sg]/1000;
        if(st.prg==='slow'){if(sg===0)tone(200,sc,{to:300,gain:0.07});else tone(300,sc,{to:200,gain:0.06})}
        else if(sg===0)tone(200,sc,{to:290,gain:0.07});
        else if(sg===1)tone(290,sc,{to:340,gain:0.07});
        else tone(340,sc,{to:190,gain:0.06});
      }
    }else if(ph.t==='prep'){
      var left=Math.ceil((d-e)/1000);
      pT=0.04;gT=0.35;
      vs.word=String(left);vs.title='Bereit';
      if(m==='run'&&left!==st.pc){st.pc=left;tick()}
    }else if(ph.t==='breath'){
      var c=ph.cyc,n=Math.min(BREATHS-1,Math.floor(e/c)),f=(e-n*c)/c,inh=f<INHALE,x=inh?f/INHALE:(f-INHALE)/(1-INHALE);
      pT=inh?ease(x):1-ease(x);gT=0.3+0.7*pT;
      vs.filled=n;vs.curF=f;
      vs.word=inh?'Ein':'Aus';vs.title='Atmen';
      var key=n*2+(inh?0:1);
      if(m==='run'&&key!==st.bk){
        st.bk=key;
        var secs=(inh?INHALE:1-INHALE)*c/1000;
        if(inh)tone(200,secs,{to:300,gain:0.07});else tone(300,secs,{to:200,gain:0.06});
      }
    }else if(ph.t==='hold'){
      pT=reduce?0.03:0.03+0.02*Math.sin(now/650);gT=0.4;dT=0;aT=1;st.prog=e/d;vs.filled=BREATHS;
      vs.word=fmt(Math.ceil((d-e)/1000));vs.title='Halten';
      var mk=Math.floor(e/30000);
      if(m==='run'&&mk>st.hm&&mk*30000<d){st.hm=mk;bell(494,1.1)}
    }else if(ph.t==='recIn'){
      pT=ease(e/d);gT=0.3+0.7*pT;dT=0;vs.filled=BREATHS;
      vs.word='Ein';vs.title='Einatmen';
    }else if(ph.t==='recHold'){
      pT=1;gT=1;dT=0;aT=1;st.prog=e/d;vs.filled=BREATHS;
      vs.word=String(Math.ceil((d-e)/1000));vs.title='Halten';
    }else{
      pT=1-ease(e/d);gT=0.3+0.7*pT;dT=0;vs.filled=BREATHS;
      vs.word='Aus';vs.title='Loslassen';
    }
  }
  if(st.prg!=='wh')dT=0;
  k=1-Math.exp(-14*dt);rs.p+=(pT-rs.p)*k;
  k=1-Math.exp(-5*dt);rs.g+=(gT-rs.g)*k;rs.dotA+=(dT-rs.dotA)*k;rs.arcA+=(aT-rs.arcA)*k;
}

/* ---------- Anzeige ---------- */
var cache={};
function setText(node,key,val){if(cache[key]!==val){cache[key]=val;node.textContent=val}}
function render(){
  var m=st.mode,ph=st.phases[st.idx],title=vs.title,i,r;
  if(m==='pause')title='Pause';
  setText(el.word,'word',vs.word);
  setText(el.ttl,'ttl',title);

  setText(el.main,'main',m==='idle'?(st.prg==='wh'?'Atmung starten':'Übung starten'):m==='run'?'Pausieren':m==='pause'?'Fortsetzen':'Noch einmal atmen');
  var wide=(m==='idle'||m==='done');
  var vk=wide+'|'+st.prg;
  if(cache.wide!==vk){cache.wide=vk;el.main.classList.toggle('wide',wide);el.side.hidden=wide;el.seg.style.visibility=wide?'visible':'hidden';el.seg.hidden=st.prg!=='wh';el.modes.style.visibility=wide?'visible':'hidden'}
  var gentle=st.prg!=='wh';
  if(cache.gentle!==gentle){cache.gentle=gentle;el.rounds.hidden=gentle;el.solo.hidden=!gentle;if(gentle){setText(el.soloT,'st',PROGS[st.prg].t);setText(el.soloS,'ss',PROGS[st.prg].s)}}
  if(gentle){setText(el.soloT,'st',PROGS[st.prg].t);setText(el.soloS,'ss',PROGS[st.prg].s)}
  var quiet=(m==='run');
  if(cache.quiet!==quiet){cache.quiet=quiet;el.main.classList.toggle('quiet',quiet)}
  var act=(m==='run'&&ph&&ph.t==='hold')?'skip':'stop';
  st.sideAct=act;
  setText(el.side,'side',act==='skip'?'Halten beenden':'Abbrechen');
  if(cache.tempoKey!==st.tempo){cache.tempoKey=st.tempo;syncSeg()}

  if(gentle){
    var sf=m==='done'?1:(m!=='idle'&&ph?(ph.off+Math.min(st.e,ph.dur))/roundTotals[0]:0);
    var sp=(Math.max(0,Math.min(1,sf))*100).toFixed(1)+'%';
    if(cache.sp!==sp){cache.sp=sp;el.solo.querySelector('i').style.width=sp}
  }
  for(i=0;!gentle&&i<roundEls.length;i++){
    var frac=0;
    if(m==='done')frac=1;
    else if(m!=='idle'&&ph){
      r=ph.r;
      if(i<r)frac=1;
      else if(i===r)frac=(ph.off+Math.min(st.e,ph.dur))/roundTotals[r];
    }
    var pct=(Math.max(0,Math.min(1,frac))*100).toFixed(1)+'%';
    if(cache['rp'+i]!==pct){cache['rp'+i]=pct;roundEls[i].querySelector('i').style.width=pct}
    var cls=(m==='done'||(m!=='idle'&&ph&&i<ph.r))?'round is-done':(m!=='idle'&&ph&&i===ph.r)?'round is-now':'round';
    if(cache['rc'+i]!==cls){cache['rc'+i]=cls;roundEls[i].className=cls}
  }
}

/* ---------- Zeichnen ---------- */
var size=360,dpr=1;
function resize(){
  var rc=el.stage.getBoundingClientRect();
  var s=Math.floor(Math.min(rc.width,rc.height,460));
  if(s<200)s=200;
  dpr=Math.min(window.devicePixelRatio||1,3);
  if(s===size&&el.cv.width===Math.round(s*dpr))return;
  size=s;
  el.orb.style.width=s+'px';el.orb.style.height=s+'px';
  el.orb.style.setProperty('--u',(s/360).toFixed(3));
  el.cv.style.width=s+'px';el.cv.style.height=s+'px';
  el.cv.width=Math.round(s*dpr);el.cv.height=Math.round(s*dpr);
}
function draw(){
  var S=size,R=S/2,u=S/360,i,a,x,y,rad,col;
  ctx.setTransform(el.cv.width/S,0,0,el.cv.width/S,0,0);
  ctx.clearRect(0,0,S,S);

  ctx.lineWidth=1.2*u;ctx.strokeStyle='rgba(74,99,132,0.2)';
  ctx.beginPath();ctx.arc(R,R,R*0.955,0,TAU);ctx.stroke();

  if(rs.dotA>0.01){
    for(i=0;i<BREATHS;i++){
      a=-Math.PI/2+i*TAU/BREATHS;x=R+Math.cos(a)*R*0.955;y=R+Math.sin(a)*R*0.955;
      if(i<vs.filled){rad=3.2*u;col='rgba(184,87,39,'+rs.dotA.toFixed(3)+')'}
      else if(i===vs.filled&&vs.curF>=0){rad=(2.4+1.4*vs.curF)*u;col='rgba(184,87,39,'+(rs.dotA*(0.45+0.55*vs.curF)).toFixed(3)+')'}
      else{rad=2*u;col='rgba(74,99,132,'+(0.3*rs.dotA).toFixed(3)+')'}
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,rad,0,TAU);ctx.fill();
    }
  }
  if(rs.arcA>0.01){
    var a0=-Math.PI/2,a1=a0+TAU*Math.max(0.0001,Math.min(1,st.prog));
    ctx.lineCap='round';ctx.lineWidth=3*u;ctx.strokeStyle='rgba(74,99,132,'+rs.arcA.toFixed(3)+')';
    ctx.beginPath();ctx.arc(R,R,R*0.955,a0,a1);ctx.stroke();
  }

  var r=R*(0.34+0.38*rs.p);
  var gR=Math.min(R,r*1.9);
  var g=ctx.createRadialGradient(R,R,r*0.5,R,R,gR);
  g.addColorStop(0,'rgba(184,87,39,'+(0.16*rs.g).toFixed(3)+')');
  g.addColorStop(1,'rgba(184,87,39,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(R,R,gR,0,TAU);ctx.fill();

  var og=ctx.createRadialGradient(R-r*0.2,R-r*0.25,r*0.1,R,R,r);
  og.addColorStop(0,'#c9692f');og.addColorStop(1,'#b85727');
  ctx.fillStyle=og;ctx.beginPath();ctx.arc(R,R,r,0,TAU);ctx.fill();
}

/* ---------- Schleife ---------- */
var last=0;
function frame(now){
  var dt=Math.min(64,last?now-last:16);last=now;
  if(st.mode==='run'){st.e+=dt;advance()}
  step(dt/1000,now);render();draw();
  requestAnimationFrame(frame);
}

syncSound();syncSeg();syncModes();
if(window.ResizeObserver){new ResizeObserver(resize).observe(el.stage)}
window.addEventListener('resize',resize);
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
