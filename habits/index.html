<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  /* Layout: Orange Fläche wie das Logo, darauf eine cremefarbene Karte mit allem Wichtigen. Dunkelbraun nur für Haken und Knöpfe. */
  --orange:#b66635;
  --cream:#f6e3c8;
  --cream-2:#ecd2ad;
  --ink:#1c0f08;
  --muted:#47311f;
  --track:#e0c59f;
  --f-head:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
html{height:100%;background:var(--orange)}
body{
  margin:0;min-height:100%;background:var(--orange);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 28px;
  -webkit-tap-highlight-color:transparent;
}
.app{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font:800 13px/1.2 var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.date{font:700 15px/1.2 var(--f-body);color:var(--ink);text-align:right}
h1{margin:0;font:800 clamp(34px,10vw,46px)/1.02 var(--f-head);letter-spacing:-.01em;color:var(--ink);text-wrap:balance}

.card{background:var(--cream);border-radius:18px;padding:18px}
.quote .lab{font:800 12px/1 var(--f-head);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.quote p{margin:12px 0 0;font:600 clamp(21px,6vw,25px)/1.3 var(--f-body);text-wrap:balance}

.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.head h2{margin:0;font:800 17px/1.2 var(--f-head);letter-spacing:.06em;text-transform:uppercase}
.count{font:700 16px/1.2 var(--f-body);color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:4px;transition:width .35s ease}

.list{list-style:none;margin:6px 0 0;padding:0}
.row{padding:14px 0;border-bottom:1px solid var(--cream-2);display:flex;flex-direction:column;gap:10px}
.row:last-child{border-bottom:0}
.main{display:flex;align-items:center;gap:12px}
.check{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:transparent;display:grid;place-items:center;padding:0;transition:background-color .15s ease}
.check svg{width:22px;height:22px;fill:none;stroke:var(--cream);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s ease}
.check[aria-pressed="true"]{background:var(--ink)}
.check[aria-pressed="true"] svg{opacity:1}
.name{flex:1;min-width:0;font:700 19px/1.25 var(--f-body);overflow-wrap:anywhere}
.row.is-done .name>div:first-child{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.del{flex:none;min-width:44px;height:44px;border:0;background:transparent;border-radius:12px;color:var(--muted);font:600 14px/1 var(--f-body);padding:0 8px}
.del svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.del.arm{color:var(--cream);background:var(--ink)}
.sub{display:flex;align-items:center;padding-left:56px}
.days{display:flex;gap:2px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;width:34px;border:0;background:transparent;padding:2px 0}
.day span{font:700 12px/1 var(--f-body);color:var(--muted)}
.day i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);display:block}
.day[aria-pressed="true"] i{background:var(--ink)}
.day.today span{color:var(--ink);font-weight:700}
.streak{margin-top:3px;font:600 14px/1.2 var(--f-body);text-decoration:none;color:var(--muted);font-variant-numeric:tabular-nums}
.streak b{color:var(--ink);font-weight:700}
.hint{margin:0;padding-top:12px;font-size:14px;font-weight:500;color:var(--muted)}
.empty{margin:0;padding:18px 0 6px;color:var(--muted);font-size:15px}

.add{display:flex;gap:8px;margin-top:14px;padding-top:16px;border-top:1px solid var(--cream-2)}
.add input{flex:1;min-width:0;height:48px;border-radius:12px;border:2px solid var(--ink);background:transparent;padding:0 14px;font-size:16px}
.add input::placeholder{color:var(--muted);opacity:.85}
.btn{height:48px;border-radius:12px;border:0;background:var(--ink);color:var(--cream);font:700 15px/1 var(--f-body);padding:0 18px}
.share{width:100%;height:56px;border-radius:14px;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.share svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:active,.check:active,.del:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.card button:focus-visible,.card input:focus-visible{outline-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:12px;font:600 15px/1.2 var(--f-body);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:4px;text-align:center;font:800 13px/1.2 var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="brand">What is a Happy Self</span>
    <span class="date" id="date"></span>
  </div>
  <h1>Happy Habits</h1>

  <section class="card quote" aria-labelledby="ql">
    <div class="lab" id="ql">Zitat des Tages</div>
    <p id="quote"></p>
  </section>

  <section class="card" aria-labelledby="hl">
    <div class="head"><h2 id="hl">Heute</h2><span class="count" id="count"></span></div>
    <div class="bar" role="progressbar" aria-labelledby="hl" aria-valuemin="0" aria-valuemax="100" id="pb"><i id="fill"></i></div>
    <ul class="list" id="list"></ul>
    <p class="hint" id="seedhint" hidden>Das sind Beispiele. Lösche sie oder ergänze deine eigenen.</p>
    <form class="add" id="add" autocomplete="off">
      <input id="new" type="text" maxlength="40" placeholder="Neue Gewohnheit" aria-label="Neue Gewohnheit">
      <button class="btn" type="submit">Hinzufügen</button>
    </form>
  </section>

  <button class="btn share" id="share" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5L12 3l4.5 4.5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
    Fortschritt teilen
  </button>

  <div class="foot">What is a Happy Self</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

'Dein zukünftiges Ich ist dankbar für jeden Haken von heute.',

'Ein bewusster Atemzug gibt dir die Wahl zurück.',

var WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
var WD_LONG=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function $(id){return document.getElementById(id)}
function pad(n){return n<10?'0'+n:''+n}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}

function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){var o=JSON.parse(r);if(o&&Array.isArray(o.habits))return o}
  }catch(e){}
  return {seeded:true,habits:[
    {id:uid(),name:'Atmung',done:{}},
    {id:uid(),name:'Wasser trinken',done:{}},
    {id:uid(),name:'10 Minuten Bewegung',done:{}}
  ]};
}
var state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

function streak(h){
  var d=new Date(),n=0;
  if(!h.done[keyOf(d)])d=addDays(d,-1);
  while(h.done[keyOf(d)]){n++;d=addDays(d,-1)}
  return n;
}
function dayIndex(d){return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}
function quoteOf(d){return QUOTES[((dayIndex(d)%QUOTES.length)+QUOTES.length)%QUOTES.length]}
function streakText(n){return n===0?'':(n===1?'1 Tag':n+' Tage')}

var el={date:$('date'),quote:$('quote'),count:$('count'),fill:$('fill'),pb:$('pb'),list:$('list'),
  seed:$('seedhint'),add:$('add'),inp:$('new'),share:$('share'),toast:$('toast')};
var armed=null,armTimer=null,toastTimer=null,shown='';

function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
var CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var TRASH='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function toggle(h,key){
  if(h.done[key])delete h.done[key];else h.done[key]=1;
  state.seeded=false;save();render();
}
function render(){
  var today=new Date(),tk=keyOf(today);
  shown=tk;
  el.date.textContent=WD_LONG[today.getDay()]+', '+today.getDate()+'. '+MONTHS[today.getMonth()];
  el.quote.textContent=quoteOf(today);

  var total=state.habits.length,done=0;
  state.habits.forEach(function(h){if(h.done[tk])done++});
  el.count.textContent=total?(done+' von '+total+' erledigt'):'';
  var pct=total?Math.round(done/total*100):0;
  el.fill.style.width=pct+'%';
  el.pb.setAttribute('aria-valuenow',String(pct));
  el.seed.hidden=!state.seeded;

  el.list.textContent='';
  if(!total){
    var li=mk('li');li.appendChild(mk('p','empty','Noch keine Gewohnheit. Schreib unten auf, was du dir jeden Tag vornimmst.'));
    el.list.appendChild(li);
  }
  state.habits.forEach(function(h){
    var isDone=!!h.done[tk];
    var li=mk('li','row'+(isDone?' is-done':''));
    var main=mk('div','main');
    var c=mk('button','check');c.type='button';c.innerHTML=CHECK;
    c.setAttribute('aria-pressed',isDone?'true':'false');
    c.setAttribute('aria-label',h.name+' heute '+(isDone?'rückgängig machen':'erledigt'));
    c.addEventListener('click',function(){toggle(h,tk)});
    var nm=mk('div','name');
    nm.appendChild(mk('div','',h.name));
    var s=streak(h);
    if(s>0){var st=mk('div','streak');st.appendChild(mk('b','',streakText(s)));st.appendChild(document.createTextNode(' in Folge'));nm.appendChild(st)}
    var del=mk('button','del');del.type='button';
    if(armed===h.id){del.className='del arm';del.textContent='Löschen?';del.setAttribute('aria-label',h.name+' endgültig löschen')}
    else{del.innerHTML=TRASH;del.setAttribute('aria-label',h.name+' löschen')}
    del.addEventListener('click',function(){
      if(armed===h.id){
        state.habits=state.habits.filter(function(x){return x.id!==h.id});
        armed=null;state.seeded=false;save();render();
      }else{
        armed=h.id;clearTimeout(armTimer);
        armTimer=setTimeout(function(){armed=null;render()},3000);
        render();
      }
    });
    main.appendChild(c);main.appendChild(nm);main.appendChild(del);

    var sub=mk('div','sub');
    var days=mk('div','days');
    for(var i=6;i>=0;i--){
      var d=addDays(today,-i),k=keyOf(d),on=!!h.done[k];
      var b=mk('button','day'+(i===0?' today':''));b.type='button';
      b.appendChild(mk('span','',WD[d.getDay()]));b.appendChild(mk('i'));
      b.setAttribute('aria-pressed',on?'true':'false');
      b.setAttribute('aria-label',h.name+', '+WD_LONG[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'., '+(on?'erledigt':'offen'));
      (function(key){b.addEventListener('click',function(){toggle(h,key)})})(k);
      days.appendChild(b);
    }
    sub.appendChild(days);
    li.appendChild(main);li.appendChild(sub);
    el.list.appendChild(li);
  });
}

el.add.addEventListener('submit',function(ev){
  ev.preventDefault();
  var v=el.inp.value.replace(/\s+/g,' ').trim();
  if(!v)return;
  if(state.habits.length>=20){say('Maximal 20 Gewohnheiten');return}
  state.habits.push({id:uid(),name:v,done:{}});
  state.seeded=false;el.inp.value='';save();render();
});

function say(msg){
  el.toast.textContent=msg;el.toast.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.toast.classList.remove('on')},2400);
}
function shareText(){
  var today=new Date(),tk=keyOf(today),total=state.habits.length,done=0,week=0,i;
  var lines=[];
  state.habits.forEach(function(h){
    var on=!!h.done[tk];if(on)done++;
    for(i=0;i<7;i++){if(h.done[keyOf(addDays(today,-i))])week++}
    var s=streak(h);
    lines.push((on?'✓ ':'○ ')+h.name+(s>1?' ('+s+' Tage in Folge)':''));
  });
  var out='What is a Happy Self\n';
  out+=total?('Mein Fortschritt heute: '+done+' von '+total+' Gewohnheiten\n\n'+lines.join('\n')+'\n\nDiese Woche: '+week+' von '+(total*7)+' Haken\n'):'Ich starte gerade mit meinen Happy Habits.\n';
  out+='\n„'+quoteOf(today)+'“';
  return out;
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);ta.select();
  var ok=false;try{ok=document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);return ok;
}
el.share.addEventListener('click',function(){
  var text=shareText(),url=location.href.split('#')[0];
  var full=text+'\n\n'+url;
  if(navigator.share){
    navigator.share({title:'Happy Habits',text:text,url:url}).catch(function(err){
      if(err&&err.name==='AbortError')return;
      copy(full);
    });
  }else copy(full);
});
function copy(full){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(full).then(function(){say('Kopiert. Jetzt in einer Nachricht einfügen.')},function(){
      say(fallbackCopy(full)?'Kopiert. Jetzt in einer Nachricht einfügen.':'Kopieren nicht möglich');
    });
  }else say(fallbackCopy(full)?'Kopiert. Jetzt in einer Nachricht einfügen.':'Kopieren nicht möglich');
}

function checkDay(){if(keyOf(new Date())!==shown)render()}
document.addEventListener('visibilitychange',function(){if(!document.hidden)checkDay()});
setInterval(checkDay,60000);
render();
})();
</script>
</body>
</html>
