body{margin:0;min-height:100vh;background:var(--orange);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.app{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,textarea{font:inherit;color:inherit}
.brand{font:800 13px/1.2 var(--f);letter-spacing:.1em;text-transform:uppercase}
h1{margin:0;font:800 clamp(34px,10vw,48px)/1.04 var(--f);letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font:800 22px/1.15 var(--f)}
h3{margin:0;font:800 14px/1.2 var(--f);letter-spacing:.08em;text-transform:uppercase}
p{margin:0}
.lead{font:600 19px/1.4 var(--f);text-wrap:balance}
.card{background:var(--cream);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted);font-weight:500;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 20px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:var(--cream);font:700 16px/1 var(--f);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink)}
.btn.sm{min-height:44px;font-size:15px}
a.btn{text-decoration:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.pill{display:inline-block;align-self:flex-start;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--cream);font:800 12px/1.2 var(--f);letter-spacing:.08em;text-transform:uppercase}
.bar{height:12px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .4s ease}
input[type=text],textarea{width:100%;border:2px solid var(--ink);border-radius:12px;background:var(--cream);padding:12px 14px;font:600 17px/1.35 var(--f);outline:none}
textarea{min-height:110px;resize:vertical;font-weight:500}
input[type=text]:focus,textarea:focus{box-shadow:0 0 0 3px var(--cream),0 0 0 5px var(--ink)}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font:600 17px/1.35 var(--f)}
ol.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--cream);display:grid;place-items:center;font:800 15px/1 var(--f)}
ol.steps li span{padding-top:3px}

.habit{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid var(--ink);border-radius:14px;background:transparent;padding:14px;cursor:pointer;min-height:68px}
.habit .box{flex:none;width:36px;height:36px;border-radius:10px;border:3px solid var(--ink);display:grid;place-items:center}
.habit .box svg{width:22px;height:22px;opacity:0}
.habit[aria-pressed="true"] small{color:var(--cream)}
.habit[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.habit[aria-pressed="true"] .box{border-color:var(--cream);background:var(--cream);color:var(--ink)}
.habit[aria-pressed="true"] .box svg{opacity:1}
.habit b{font:800 18px/1.25 var(--f)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--track)}
.dots i.on{background:var(--ink)}
.dots i.now{outline:2px solid var(--ink);outline-offset:2px}

.week{border-radius:14px;background:var(--cream);overflow:hidden}
.week>button{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;width:100%;padding:14px 16px;cursor:pointer;min-height:60px}
.week>button:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
.week .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--cream);display:grid;place-items:center;font:800 15px/1 var(--f)}
.week.locked .n{background:var(--track);color:var(--muted)}
.week .t{flex:1;min-width:0}
.week .t b{display:block;font:800 17px/1.2 var(--f)}
.week .t small{font:500 14px/1.3 var(--f);color:var(--muted)}
.week .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.week.now{outline:3px solid var(--ink)}
.phase{margin-top:6px}

.sl{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center}
.sl label{font:700 16px/1.2 var(--f)}
.sl output{font:800 18px/1 var(--f);text-align:right}
input[type=range]{width:100%;height:44px;accent-color:var(--ink);background:transparent}
.cmp{display:grid;grid-template-columns:90px repeat(3,1fr);gap:8px 10px;align-items:center;font:700 15px/1.2 var(--f)}
.cmp .h{font:800 12px/1.2 var(--f);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.cmp .v{text-align:center;font:800 20px/1 var(--f)}
.note-item{border-top:1px solid var(--cream-2);padding-top:10px}
.note-item small{font:800 12px/1.2 var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note-item p{white-space:pre-wrap;margin-top:4px;font-weight:500}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--ink);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav button{all:unset;box-sizing:border-box;min-height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 16px/1 var(--f);color:var(--cream);cursor:pointer;opacity:.75}
nav button[aria-current="page"]{background:var(--cream);color:var(--ink);opacity:1}
nav button:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.card button:focus-visible{outline-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:12px;font:600 15px/1.2 var(--f);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;max-width:calc(100% - 32px);text-align:center;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.art{display:block;width:100%;height:auto;max-height:96px}
.art *{vector-effect:non-scaling-stroke}
details.sci{border-top:1px solid var(--cream-2);padding-top:10px}
details.sci summary{cursor:pointer;font:800 14px/1.2 var(--f);letter-spacing:.06em;text-transform:uppercase;min-height:32px;display:flex;align-items:center}
details.sci summary::marker{color:var(--ink)}
details.sci p{margin-top:8px;font-weight:500}
details.sci .ref{font:500 13px/1.4 var(--f);color:var(--muted)}
.journey{display:grid;grid-template-columns:repeat(13,1fr);gap:3px}
.journey i{height:10px;border-radius:3px;background:var(--track)}
.journey i.on{background:var(--ink)}
.journey i.now{background:var(--cream);outline:2px solid var(--ink);outline-offset:1px}
.jl{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;font:800 11px/1.2 var(--f);letter-spacing:.06em;text-transform:uppercase}
.radar{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:700 14px/1.2 var(--f)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:26px;height:10px}
.refs{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font:500 14px/1.4 var(--f);color:var(--muted)}
.err{color:#7a1d0c;font:700 15px/1.3 var(--f);min-height:1.3em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<nav id="nav" hidden><div class="in">
  <button type="button" data-tab="today" aria-current="page">Today</button>
  <button type="button" data-tab="program">Program</button>
  <button type="button" data-tab="log">Progress</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

var BREATH='../../';
var KEY='msy1en',CODEKEY='msy1encode',DAY=86400000;
var app=document.getElementById('app'),nav=document.getElementById('nav');
var content=null,tab='today',st=load();

function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object'){s.done=s.done||{};s.notes=s.notes||{};s.assess=s.assess||{};return s}}catch(e){}
  return {start:null,done:{},notes:{},assess:{}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){
    if(k==='text')e.textContent=attrs[k];
    else if(k==='class')e.className=attrs[k];
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;e.appendChild(typeof c==='string'?document.createTextNode(c):c)}
  return e;
}
var tt=null;
function say(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2400)}
function pad(n){return n<10?'0'+n:''+n}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function midnight(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function dayNo(){ /* Tag 1 = Starttag */
  var s=midnight(new Date(st.start+'T12:00:00')),t=midnight(new Date());
  return Math.round((t-s)/DAY)+1;
}
function weekOf(day){return Math.max(1,Math.min(13,Math.ceil(day/7)))}
function weekStartKey(w){var s=new Date(st.start+'T12:00:00');s.setDate(s.getDate()+(w-1)*7);return dkey(s)}
function weekDays(w){var a=[],s=new Date(st.start+'T12:00:00');for(var i=0;i<7;i++){var d=new Date(s);d.setDate(s.getDate()+(w-1)*7+i);a.push(dkey(d))}return a}
function doneCount(w){var c=0;weekDays(w).forEach(function(k){if(st.done[k])c++});return c}

function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}

function decrypt(code){
  var raw=b64(PAYLOAD),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28),enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(norm(code)),'PBKDF2',false,['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  }).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct)})
    .then(function(buf){return JSON.parse(new TextDecoder().decode(buf))});
}

function gate(){

    var n;try{n=dec(ta.value)}catch(e){err.textContent='This is not a valid backup code.';return}
    for(var k in n.done)st.done[k]=1;
    for(var w in n.notes)if(n.notes[w]&&!(st.notes[w]||'').trim())st.notes[w]=n.notes[w];
    for(var a in n.assess)st.assess[a]=n.assess[a];
    st.start=n.start;save();say('Backup restored.');render();window.scrollTo(0,0);
  }}));
  box.appendChild(wrap);ta.focus();
}
function summary(){
  var l=['Master Your System, status','Start: '+st.start,''];
  ['a0','a6','a13'].forEach(function(k){var a=st.assess[k];if(a)l.push('Rating '+ALABEL[k]+': Energy '+a.e+', Focus '+a.f+', EQ '+a.q)});
  l.push('Days with micro-habit: '+totalDone(),'');
  for(var j=1;j<=13;j++){var t=(st.notes[j]||'').trim();if(t)l.push('Week '+j+' ('+content.weeks[j-1].title+'):',t,'')}
  return l.join('\n');
}
function shareNotes(){
  var text=summary();
  function fb(){
    var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);
    say(ok?'Copied. Now paste it into a message.':'Copying not possible');
  }
  if(navigator.share){navigator.share({title:'Master Your System',text:text}).catch(function(e){if(!e||e.name!=='AbortError')fb()})}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){say('Copied. Now paste it into a message.')},fb)}
  else fb();
}

nav.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  tab=b.getAttribute('data-tab');render();window.scrollTo(0,0);
});

(function(){
  var c=null;try{c=localStorage.getItem(CODEKEY)}catch(e){}
  if(c&&window.crypto&&crypto.subtle){decrypt(c).then(function(x){content=x;render()},function(){render()})}
  else render();
})();
})();
